<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorización de gastos y facturas · Plataforma HT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ht.css?v=2026-09-24a">
</head>
<body>

<header>
  <div class="cinta"></div>
  <div class="barra">
    <div class="marca">Plataforma <span>HT</span></div>
    <div class="rotulo"><b>HT RENT &gt;</b><span>ARRENDA Y CRECE</span></div>
    <div class="quien">
      <b id="nombreUsuario">—</b><br>
      <span class="eyebrow" id="puestoUsuario"></span>
    </div>
    <button class="salir" id="salir">Salir</button>
  </div>
</header>

<main>
  <a class="migaja" href="index.html">← Volver a módulos</a>
  <h1 id="titulo">Autorización de gastos y facturas</h1>
  <span class="eyebrow" id="subtitulo">Operaciones · corte lunes y miércoles a las 12:00</span>

  <div id="franja"></div>

  <section>
    <h2>Resumen</h2>
    <div class="cifras" id="cifras"></div>
  </section>

  <section>
    <div class="pestanas" role="tablist">
      <button class="pestana" role="tab" data-tab="pend">Por atender<span class="c" id="cPend">0</span></button>
      <button class="pestana" role="tab" data-tab="mias">Mis solicitudes<span class="c" id="cMias">0</span></button>
      <button class="pestana" role="tab" data-tab="todas">Todas<span class="c" id="cTodas">0</span></button>
      <button class="btn chico" id="nueva" style="margin-left:auto;margin-bottom:6px">+ Nueva solicitud</button>
    </div>
    <div class="filtros">
      <input id="q" placeholder="Folio, concepto, proveedor, factura o NIV" spellcheck="false">
      <select id="fTipo"><option value="">Facturas y gastos</option><option value="factura">Solo facturas</option><option value="gasto">Solo gastos</option></select>
      <button class="btn navy chico" id="concentrado" type="button">Concentrado para pagos</button>
      <select id="fEstado"><option value="">Todos los estatus</option><option value="en_proceso">En autorización</option><option value="devuelta">Devuelta</option><option value="autorizada">Autorizada, en lote</option><option value="enviada">Enviada a pagos</option><option value="rechazada">Rechazada</option><option value="cancelada">Cancelada</option></select>
    </div>
    <div class="resultados" id="lista"><p class="cargando">Cargando solicitudes…</p></div>
  </section>
</main>

<div class="telon" id="telon"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-cab"><h3 id="panelTitulo"></h3><button class="cerrar" id="cerrar" aria-label="Cerrar">×</button></div>
  <div class="panel-cuerpo" id="panelCuerpo"></div>
  <div id="panelPie"></div>
</aside>
<div class="nota" id="nota" role="status"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL  = 'https://ahfjstuwekcuxshclprl.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoZmpzdHV3ZWtjdXhzaGNscHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDg2MjYsImV4cCI6MjEwMzYyNDYyNn0.lf1uw8WHPRy21GuYlK9NzeI5JgJK2be1LrODq22CodM';
const BUCKET = 'gastos-adjuntos';

const core = createClient(SUPABASE_URL, SUPABASE_ANON, { db:{ schema:'core' } });
const g = core.schema('gastos');

/* cortes de envío: 1 = lunes, 3 = miércoles, 12:00, pago al día siguiente */
const CORTES = [{dia:1,hora:12,min:0,diasPago:1},{dia:3,hora:12,min:0,diasPago:1}];
const TIPOS_GASTO = ['Movimiento entre patios','Reparación o mantenimiento','Gestoría y trámites','Verificaciones y permisos','Estadía en patio','Refacciones','Viáticos','Otro'];
/* Mientras Dirección indique lo contrario, el módulo opera solo con facturas.
   Para reactivar los gastos, cambia esta línea a false. */
const SOLO_FACTURAS = true;
const ESTADOS = {en_proceso:'En autorización',devuelta:'Devuelta',autorizada:'Autorizada, en lote',enviada:'Enviada a pagos',rechazada:'Rechazada',cancelada:'Cancelada'};

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0);
const fDia = d => d ? new Date(String(d).length===10 ? d+'T12:00:00' : d).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const fLargo = d => d ? new Date(String(d).length===10 ? d+'T12:00:00' : d).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}) : '—';
const fHora = d => d ? new Date(d).toLocaleString('es-MX',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
const kb = n => n>1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';
const parseNivs = t => [...new Set(String(t||'').toUpperCase().split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean))];
function nota(t){ const n=$('nota'); n.textContent=t; n.classList.add('on'); clearTimeout(nota._t); nota._t=setTimeout(()=>n.classList.remove('on'),4000); }

const estado = { yo:null, lista:[], personas:{}, proveedores:[], tab:'pend', q:'', fTipo:'', fEstado:'', abierto:null, catalogo:{} };

/* ---------------- arranque ---------------- */
const { data:{ session } } = await core.auth.getSession();
if(!session){ location.href = 'index.html'; }
const usuario = session.user;

const { data: perfil } = await core.from('perfiles').select('nombre,puesto').eq('id', usuario.id).maybeSingle();
$('nombreUsuario').textContent = perfil?.nombre || usuario.email;
$('puestoUsuario').textContent = perfil?.puesto || '';
estado.yo = { id: usuario.id, nombre: perfil?.nombre || usuario.email, puesto: perfil?.puesto || '' };

const { data: gente } = await g.from('v_personas').select('id,nombre,puesto');
(gente||[]).forEach(p => estado.personas[p.id] = p);
estado.personas[usuario.id] ??= estado.yo;

const { data: provs } = await g.from('proveedores').select('nombre,rfc,contacto').order('nombre');
estado.proveedores = provs || [];

/* ---------------- datos ---------------- */
const nombreDe = id => estado.personas[id]?.nombre || 'Autorizador';
const puestoDe = id => estado.personas[id]?.puesto || '';

async function cargar(){
  const { data, error } = await g.from('solicitudes')
    .select('*, lote:lotes(corte,fecha_pago), historial(id,accion,usuario,usuario_id,comentario,tipo,fecha), adjuntos(id,clase,nombre,ruta,tam_bytes)')
    .order('creado', { ascending:false });
  if(error){ $('lista').innerHTML = `<p class="vacio">No se pudieron leer las solicitudes: ${esc(error.message)}</p>`; return; }
  estado.lista = (data||[]).map(s => ({...s, historial:(s.historial||[]).sort((a,b)=>a.fecha.localeCompare(b.fecha))}));
  pintar();
  if(estado.abierto?.tipo==='detalle'){
    const s = estado.lista.find(x=>x.id===estado.abierto.id);
    if(s) verDetalle(s);
  }
}

const turnoDe = s => s.estado==='en_proceso' ? (s.cadena||[])[s.paso] : (s.estado==='devuelta' ? s.solicitante_id : null);
const esMiTurno = s => s.estado==='en_proceso' && (s.cadena||[])[s.paso] === estado.yo.id;
const pendienteMia = s => esMiTurno(s) || (s.estado==='devuelta' && s.solicitante_id===estado.yo.id);
const diasEspera = s => { const h=s.historial?.[s.historial.length-1]; return h ? (Date.now()-new Date(h.fecha))/864e5 : 0; };

function siguienteCorte(desde){
  const d0 = new Date(desde); let mejor=null;
  for(let i=0;i<=8;i++) for(const c of CORTES){
    const d=new Date(d0); d.setDate(d0.getDate()+i); d.setHours(c.hora,c.min,0,0);
    if(d.getDay()===c.dia && d>=d0 && (!mejor || d<mejor.envio)){
      const pago=new Date(d); pago.setDate(d.getDate()+c.diasPago); mejor={envio:d,pago};
    }
  }
  return mejor;
}
function loteDe(s){
  if(s.lote_id && s.lote) return {envio:new Date(s.lote.corte), pago:new Date(s.lote.fecha_pago)};
  const base = new Date(Math.max(new Date(s.creado).getTime(), new Date(s.autorizado_en||Date.now()).getTime()));
  return siguienteCorte(base);
}

/* ---------------- lista ---------------- */
function visibles(){
  let l = [...estado.lista];
  if(estado.tab==='pend') l = l.filter(pendienteMia).sort((a,b)=>diasEspera(b)-diasEspera(a));
  if(estado.tab==='mias') l = l.filter(s=>s.solicitante_id===estado.yo.id);
  if(estado.fTipo) l = l.filter(s=>s.tipo===estado.fTipo);
  if(estado.fEstado) l = l.filter(s=>s.estado===estado.fEstado);
  const q = estado.q.trim().toLowerCase();
  if(q) l = l.filter(s => [s.folio,s.concepto,s.proveedor,s.rfc,s.factura_numero,s.factura_uuid,s.gasto_tipo,s.solicitante_nombre,...(s.nivs||[])].join(' ').toLowerCase().includes(q));
  return l;
}

function pintar(){
  const L = estado.lista;
  const pend = L.filter(pendienteMia);
  $('cPend').textContent = pend.length;
  $('cMias').textContent = L.filter(s=>s.solicitante_id===estado.yo.id).length;
  $('cTodas').textContent = L.length;
  document.querySelectorAll('.pestana').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===estado.tab));

  if(pend.length){
    const viejo = Math.max(...pend.map(diasEspera));
    $('franja').innerHTML = `<div class="franja"><p>Tienes <b>${pend.length}</b> ${pend.length===1?'solicitud':'solicitudes'} esperando tu acción. La más antigua lleva ${viejo<1?'menos de un día':Math.floor(viejo)+(Math.floor(viejo)===1?' día':' días')}.</p><button class="btn senal chico" id="irPend">Revisar</button></div>`;
    $('irPend').onclick = () => { estado.tab='pend'; pintar(); };
  } else $('franja').innerHTML = '';

  const enProc = L.filter(s=>s.estado==='en_proceso');
  const enLote = L.filter(s=>s.estado==='autorizada');
  const prox = siguienteCorte(new Date());
  const fmt = n => (n??0).toLocaleString('es-MX');
  $('cifras').innerHTML = `
    <div class="cifra${pend.length?' urge':''}"><div class="n">${fmt(pend.length)}</div><div class="t">esperan tu acción</div></div>
    <div class="cifra"><div class="n">${fmt(enProc.length)}</div><div class="t">en autorización</div></div>
    <div class="cifra"><div class="n">${money(enProc.reduce((a,s)=>a+Number(s.total||0),0))}</div><div class="t">monto en proceso</div></div>
    <div class="cifra"><div class="n">${fmt(enLote.length)}</div><div class="t">listas para el envío del ${fDia(prox.envio)}</div></div>`;

  const filas = visibles();
  if(!filas.length){
    const msg = estado.tab==='pend' ? 'Nada pendiente por ahora.' : (L.length ? 'Ninguna solicitud coincide con el filtro.' : 'Todavía no hay solicitudes registradas.');
    $('lista').innerHTML = `<p class="vacio">${msg}</p>`;
    return;
  }
  $('lista').innerHTML = `<table><thead><tr>
      <th>Folio</th><th>Tipo</th><th>Concepto</th><th>Monto</th><th>Solicita</th><th>Turno</th>
    </tr></thead><tbody>${filas.map(s=>{
      const t = turnoDe(s), d = diasEspera(s);
      const turno = t
        ? `${esc(nombreDe(t))}<span class="sub">${d<1?'hoy':Math.floor(d)+' días'}</span>`
        : `<span class="sello ${s.estado==='enviada'?'oscuro':s.estado==='autorizada'?'ok':s.estado==='rechazada'?'mal':'gris'}">${ESTADOS[s.estado]}</span>`;
      return `<tr class="fila" data-id="${s.id}">
        <td class="niv"><b>${esc(s.folio||'')}</b><span class="sub">${fDia(s.creado)}</span></td>
        <td><span class="sello ${s.tipo==='factura'?'gris':''}">${s.tipo==='factura'?'Factura':'Gasto'}</span>${s.urgencia==='Urgente'?'<span class="sub" style="color:var(--alerta)">urgente</span>':''}</td>
        <td>${esc(s.concepto)}<span class="sub">${esc(s.tipo==='factura' ? `${s.proveedor||''} · ${s.factura_numero||''}` : (s.gasto_tipo||''))}${(s.nivs||[]).length?` · ${s.nivs.length} NIV${s.nivs.length>1?'s':''}`:''}${(s.adjuntos||[]).length?' · con archivos':''}</span></td>
        <td class="num">${money(s.total)}${s.estadia?.total?`<span class="sub">+ estadía ${money(s.estadia.total)}</span>`:''}</td>
        <td>${esc(s.solicitante_nombre||'')}</td>
        <td>${turno}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

/* ---------------- panel ---------------- */
function abrir(){ $('panel').classList.add('on'); $('telon').classList.add('on'); $('panel').setAttribute('aria-hidden','false'); }
function cerrar(){ $('panel').classList.remove('on'); $('telon').classList.remove('on'); $('panel').setAttribute('aria-hidden','true'); estado.abierto=null; }

function rutaHTML(s){
  const pasos = [{id:s.solicitante_id, papel:'Solicita', clase:'info', cuando:s.creado}];
  (s.cadena||[]).forEach((u,i)=>{
    let clase='';
    if(i<s.paso) clase='hecho';
    else if(i===s.paso){
      if(s.estado==='en_proceso') clase='turno';
      else if(s.estado==='rechazada'||s.estado==='devuelta') clase='mal';
    }
    if(['autorizada','enviada'].includes(s.estado)) clase='hecho';
    const ev = [...(s.historial||[])].reverse().find(h=>h.usuario_id===u && /^Autoriz/.test(h.accion));
    pasos.push({id:u, papel:puestoDe(u)||'Autoriza', clase, cuando: clase==='hecho'&&ev?ev.fecha:null});
  });
  const l = loteDe(s);
  const enviada = s.estado==='enviada';
  pasos.push({
    nombre: enviada ? 'Enviada a pagos' : 'Envío a pagos',
    papel: ['autorizada','enviada'].includes(s.estado) ? `Pago ${fDia(l.pago)}` : 'Lunes o miércoles',
    cuandoTexto: ['autorizada','enviada'].includes(s.estado) ? fDia(l.envio) : '',
    clase: enviada ? 'hecho' : (s.estado==='autorizada' ? 'info' : '')
  });
  return `<div class="chain">${pasos.map(p=>`<div class="chev ${p.clase}"><strong>${esc(p.nombre||nombreDe(p.id))}</strong>${esc(p.papel)}${p.cuando?`<br>${fDia(p.cuando)}`:(p.cuandoTexto?`<br>${esc(p.cuandoTexto)}`:'')}</div>`).join('')}</div>`;
}

async function verDetalle(s){
  estado.abierto = {tipo:'detalle', id:s.id};
  $('panelTitulo').textContent = `${s.folio} · ${s.tipo==='factura'?'Factura':'Gasto'}`;
  const mio = s.solicitante_id===estado.yo.id;
  const malo = [...(s.historial||[])].reverse().find(h=>h.tipo==='bad');
  const e = s.estadia, l = loteDe(s), t = turnoDe(s);

  let acciones = '';
  if(esMiTurno(s)){
    acciones = `<div class="acciones">
        <button class="btn" data-ac="autorizar">Autorizar</button>
        <button class="btn claro" data-ac="pedirMotivo" data-clase="devolver">Devolver para corrección</button>
        <button class="btn alerta" data-ac="pedirMotivo" data-clase="rechazar">Rechazar</button></div>
      <div class="motivo" id="motivo"><div class="campo"><span class="lbl" id="motivoLbl"></span><textarea id="motivoTxt" rows="3"></textarea></div>
      <div class="acciones" style="margin-top:10px"><button class="btn alerta" data-ac="confirmarMotivo">Confirmar</button><button class="btn claro" data-ac="ocultarMotivo">Cancelar</button></div></div>`;
  } else if(s.estado==='devuelta' && mio){
    acciones = `<div class="acciones"><button class="btn" data-ac="corregir">Corregir y reenviar</button><button class="btn claro" data-ac="cancelar">Cancelar solicitud</button></div>`;
  } else if(s.estado==='autorizada'){
    acciones = `<p class="q">Autorizada. Entra en el reporte a pagos del <b>${esc(fLargo(l.envio))}</b> para pago el <b>${esc(fLargo(l.pago))}</b>.</p>`;
  } else if(t){
    acciones = `<p class="q">Turno de <b>${esc(nombreDe(t))}</b>${puestoDe(t)?`, ${esc(puestoDe(t))}`:''}.</p>
      <div class="acciones" style="margin-top:10px"><button class="btn claro chico" data-ac="recordar">Copiar recordatorio</button>${mio&&s.estado==='en_proceso'?'<button class="btn claro chico" data-ac="cancelar">Cancelar solicitud</button>':''}</div>`;
  } else {
    acciones = `<p class="q">Solicitud ${ESTADOS[s.estado].toLowerCase()}.</p>`;
  }

  const relacionadas = (s.nivs||[]).length
    ? estado.lista.filter(o=>o.id!==s.id && o.estado!=='cancelada' && (o.nivs||[]).some(n=>s.nivs.includes(n)))
    : [];

  $('panelCuerpo').innerHTML = `
    ${e?.total?`<div class="bloque foco"><h3>Estadía en el patio destino</h3>
      <div class="importes"><div><div class="g">${money(e.total)}</div><div class="t">estimado</div></div>
      <div><div class="v">${money(e.costoDia)} por día · ${e.dias} ${Number(e.dias)===1?'día':'días'}</div><div class="t">${esc(e.destino||'patio destino')}${e.origen?` · desde ${esc(e.origen)}`:''}</div></div>
      <div><div class="v">${money(Number(s.total)+Number(e.total))}</div><div class="t">costo total del movimiento</div></div></div></div>`:''}
    ${malo && ['rechazada','devuelta'].includes(s.estado) ? `<div class="bloque aviso"><h3>${s.estado==='rechazada'?'Rechazada':'Devuelta'} por ${esc(malo.usuario)}</h3>
      <p>${esc(malo.comentario||'')}</p><p class="q">${fHora(malo.fecha)}</p></div>`:''}

    <div class="bloque"><h3>Ruta de autorización</h3>${rutaHTML(s)}<div style="margin-top:14px">${acciones}</div></div>

    <div class="bloque">
      <div class="importes">
        <div><div class="g">${money(s.total)}</div><div class="t">total${s.xml_datos?' (del XML)':''}</div></div>
        <div><div class="v">${money(s.subtotal)}</div><div class="t">subtotal</div></div>
        <div><div class="v">${money(s.iva)}</div><div class="t">IVA ${s.iva_pct}%</div></div>
        ${Number(s.retenciones)?`<div><div class="v">−${money(s.retenciones)}</div><div class="t">retenciones</div></div>`:''}
        <div><span class="sello ${s.estado==='enviada'?'oscuro':s.estado==='autorizada'?'ok':s.estado==='rechazada'?'mal':'gris'}">${ESTADOS[s.estado]}</span></div>
      </div>
      <dl class="datos">
        <div><dt>Concepto</dt><dd>${esc(s.concepto)}</dd></div>
        ${s.tipo==='factura'?`
          <div><dt>Proveedor</dt><dd>${esc(s.proveedor||'—')}${s.rfc?`<span class="sub">RFC ${esc(s.rfc)}</span>`:''}</dd></div>
          <div><dt>No. de factura</dt><dd>${esc(s.factura_numero||'—')}</dd></div>
          <div><dt>Fecha de factura</dt><dd>${fDia(s.factura_fecha)}</dd></div>
          ${s.factura_uuid?`<div style="grid-column:1/-1"><dt>Folio fiscal</dt><dd class="mono">${esc(s.factura_uuid)}</dd></div>`:''}`
        :`<div><dt>Tipo de gasto</dt><dd>${esc(s.gasto_tipo||'—')}</dd></div>${s.proveedor?`<div><dt>Proveedor</dt><dd>${esc(s.proveedor)}</dd></div>`:''}`}
        <div><dt>Solicita</dt><dd>${esc(s.solicitante_nombre||'')}<span class="sub">${esc(s.solicitante_puesto||'')}</span></dd></div>
        <div><dt>Fecha requerida</dt><dd>${fDia(s.fecha_requerida)}${s.urgencia==='Urgente'?' <span class="sello mal">urgente</span>':''}</dd></div>
      </dl>
      ${(s.adjuntos||[]).length?`<div class="archivos" style="margin-top:16px">${s.adjuntos.map(a=>`<a class="chip" href="#" data-ver="${a.id}">${a.clase==='xml'?'Ver XML':a.clase==='pdf'?'Ver PDF':'Ver soporte'}<small>${esc(a.nombre)}${a.tam_bytes?`, ${kb(a.tam_bytes)}`:''}</small></a>`).join('')}</div>`:''}
    </div>

    ${s.justificacion?`<div class="bloque"><h3>${s.tipo==='gasto'?'Justificación':'Comentarios'}</h3><p style="white-space:pre-wrap">${esc(s.justificacion)}</p></div>`:''}

    ${(s.nivs||[]).length?`<div class="bloque"><h3>Unidades incluidas (${s.nivs.length})</h3>
      <div id="nivsDetalle" class="nivs">${s.nivs.map(n=>`<span class="pieza">${esc(n)}</span>`).join('')}</div>
      ${relacionadas.length?`<h3 style="margin-top:18px">Otras solicitudes con estas unidades</h3><ul class="linea">${relacionadas.map(o=>`<li><a href="#" data-id="${o.id}" class="t">${esc(o.folio)}</a> ${esc(o.concepto)} <span class="mono">${money(o.total)}</span> <span class="sello gris">${ESTADOS[o.estado]}</span></li>`).join('')}</ul>`:''}
    </div>`:''}

    <div class="bloque"><h3>Historial</h3><ul class="linea">${(s.historial||[]).map(h=>`<li class="${esc(h.tipo||'')}">
      <div class="t">${esc(h.accion)}</div>
      <div class="m">${esc(h.usuario)} · ${fHora(h.fecha)}</div>
      ${h.comentario?`<div class="c">${esc(h.comentario)}</div>`:''}</li>`).join('')}</ul></div>`;
  $('panelPie').innerHTML = '';
  abrir();
  if((s.nivs||[]).length) pintarNivsDetalle(s.nivs);
}

async function pintarNivsDetalle(nivs){
  const info = await validarNivs(nivs);
  const cont = $('nivsDetalle'); if(!cont) return;
  cont.innerHTML = nivs.map(n=>{
    const i = info[n];
    const clase = !i ? '' : i.existe ? 'ok' : 'no';
    const pie = !i ? '' : i.existe ? esc([i.patio,i.tipo].filter(Boolean).join(' · ')) : 'no está en el inventario';
    return `<span class="pieza ${clase}">${esc(n)}${pie?`<small>${pie}</small>`:''}</span>`;
  }).join('');
}

async function validarNivs(nivs){
  const faltan = nivs.filter(n=>!(n in estado.catalogo));
  if(faltan.length){
    const { data } = await g.rpc('validar_nivs', { p_nivs: faltan });
    (data||[]).forEach(r => estado.catalogo[r.niv] = r);
    faltan.forEach(n => estado.catalogo[n] ??= null);
  }
  const out = {}; nivs.forEach(n => out[n] = estado.catalogo[n]); return out;
}

function ivaPct(){ if(xmlDatos) return Number(xmlDatos.ivaPct)||0; const v=$('fIva').value; return v==='otro' ? (parseFloat($('fIvaOtro').value)||0) : Number(v); }
function montos(){

  const m = parseFloat($('fMonto').value)||0, p = ivaPct()/100, incl = $('fIncl').checked;
  const subtotal = incl ? m/(1+p) : m, total = incl ? m : m*(1+p);
  return {capturado:m, subtotal:+subtotal.toFixed(2), iva:+(total-subtotal).toFixed(2), ret:0, total:+total.toFixed(2)};
}
function estadiaVals(){

  const costoDia = parseFloat($('eDia').value)||0, dias = parseInt($('eDias').value,10)||0;
  return {origen:$('eOri').value.trim(), destino:$('eDes').value.trim(), costoDia, dias, total:+(costoDia*dias).toFixed(2)};
}

      ((uuid && norm(o.factura_uuid)===norm(uuid)) || (num && norm(o.factura_numero)===norm(num) && ((rfc && norm(o.rfc)===norm(rfc)) || (prov && norm(o.proveedor)===norm(prov))))));

  }).join('') + (n.length>60?`<span class="pieza">y ${n.length-60} más</span>`:'');
}

/* ------- lectura del CFDI ------- */
function leerCFDI(texto){
  const doc = new DOMParser().parseFromString(texto,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('El archivo no es un XML válido.');
  const q = n => doc.getElementsByTagNameNS('*',n)[0];
  const c = q('Comprobante'); if(!c) throw new Error('El XML no es una factura CFDI.');
  const at = (el,a) => el?.getAttribute(a) || '';
  const em = q('Emisor'), tfd = q('TimbreFiscalDigital');
  const imp = [...c.children].find(x=>x.localName==='Impuestos');
  const tras = imp ? [...imp.getElementsByTagNameNS('*','Traslado')].filter(t=>at(t,'Impuesto')==='002') : [];
  const iva = tras.reduce((a,t)=>a+(+at(t,'Importe')||0),0);
  const tasa = tras.find(t=>at(t,'TasaOCuota'));
  const subtotal = (+at(c,'SubTotal')||0) - (+at(c,'Descuento')||0);
  const serie = at(c,'Serie'), folio = at(c,'Folio'), uuid = at(tfd,'UUID').toUpperCase();
  const conceptos = [...doc.getElementsByTagNameNS('*','Concepto')].map(x=>at(x,'Descripcion').trim()).filter(Boolean);
  return {
    numero: serie&&folio ? `${serie}-${folio}` : (folio||serie||uuid.slice(-8)),
    fecha: at(c,'Fecha').slice(0,10), proveedor: at(em,'Nombre'), rfc: at(em,'Rfc').toUpperCase(), uuid,
    subtotal:+subtotal.toFixed(2), iva:+iva.toFixed(2),
    ivaPct: tasa ? +((+at(tasa,'TasaOCuota'))*100).toFixed(2) : (subtotal ? +(iva/subtotal*100).toFixed(2) : 0),
    retenciones: +(+at(imp,'TotalImpuestosRetenidos')||0).toFixed(2),
    total: +(+at(c,'Total')||0).toFixed(2), moneda: at(c,'Moneda')||'MXN', tipoComp: at(c,'TipoDeComprobante'),
    concepto: conceptos.length ? conceptos[0].slice(0,160) + (conceptos.length>1?` (y ${conceptos.length-1} concepto${conceptos.length>2?'s':''} más)`:'') : ''
  };
}
async function tomarXml(file){
  try{
    const texto = await file.text();
    const x = leerCFDI(texto);
    xmlDatos = x; archivos.xml = file; archivos.xmlTexto = texto;
    const set = (id,v) => { if($(id) && v) $(id).value = v; };
    set('fNum',x.numero); set('fFecha',x.fecha); set('fProv',x.proveedor); set('fRfc',x.rfc); set('fUuid',x.uuid);
    if($('fConc') && !$('fConc').value.trim()) $('fConc').value = x.concepto;
    $('fMonto').value = x.total; $('fIncl').checked = true;
    const opt = [...$('fIva').options].find(o=>Number(o.value)===x.ivaPct && o.value!=='otro');
    if(opt) $('fIva').value = opt.value; else { $('fIva').value='otro'; $('fIvaOtro').value = x.ivaPct; }
    const avisos = [];
    if(x.tipoComp && x.tipoComp!=='I') avisos.push(`El comprobante es tipo "${x.tipoComp}", no de ingreso.`);
    if(x.moneda && x.moneda!=='MXN') avisos.push(`La factura está en ${x.moneda}.`);
    if(!x.uuid) avisos.push('El XML no trae timbre fiscal (UUID).');
    $('xmlAviso').innerHTML = `<div class="calculo" style="margin-top:12px"><span>Del XML: <b>${esc(x.proveedor)}</b></span><span>${esc(x.numero)}</span><span>${money(x.total)}</span><span><a href="#" data-ac="quitarXml">quitar y capturar a mano</a></span></div>
      ${avisos.map(a=>`<p class="pista" style="color:var(--senal-honda)">${esc(a)}</p>`).join('')}`;
    const caja = $('cajaXml'); caja.classList.add('tiene'); caja.querySelector('span').textContent = `${file.name}, ${kb(file.size)}`;
    bloquearXml(); recalcular();
  }catch(err){ $('xmlAviso').innerHTML = `<p class="pista" style="color:var(--alerta)">${esc(err.message)}</p>`; }
}
function tomarPdf(file){
  if(!/\.pdf$/i.test(file.name) && file.type!=='application/pdf'){ nota('Ese archivo no es un PDF.'); return; }
  archivos.pdf = file;
  const caja = $('cajaPdf'); caja.classList.add('tiene'); caja.querySelector('span').textContent = `${file.name}, ${kb(file.size)}`;
}

/* ------- guardar ------- */
function marcar(id, mal){ const c = $(id)?.closest('.campo'); if(c) c.classList.toggle('mal', mal); return mal?1:0; }
async function enviar(){
  const a = montos(), concepto = $('fConc').value.trim(), prov = $('fProv').value.trim();
  let errs = 0;
  errs += marcar('fConc', !concepto);
  errs += marcar('fMonto', !(a.total>0));
  if(tipoForm==='factura'){ errs += marcar('fNum', !$('fNum').value.trim()); errs += marcar('fProv', !prov); }
  else { errs += marcar('fGTipo', !$('fGTipo').value); errs += marcar('fJust', $('fJust').value.trim().length<15); }
  if(errs){ nota('Revisa los campos marcados en rojo.'); return; }

  const nivs = parseNivs($('fNivs').value);
  const info = await validarNivs(nivs);
  const faltantes = nivs.filter(n=>!info[n]?.existe);
  if(faltantes.length && !confirm(`${faltantes.length} NIV${faltantes.length>1?'s no están':' no está'} en el inventario:\n${faltantes.slice(0,8).join('\n')}${faltantes.length>8?'\n…':''}\n\n¿Enviar así?`)) return;

  const btn = $('btnEnviar'); btn.disabled = true; btn.textContent = 'Enviando…';
  const datos = {
    tipo: tipoForm, concepto, proveedor: prov || null,
    rfc: tipoForm==='factura' ? ($('fRfc').value.trim().toUpperCase() || null) : null,
    monto_capturado: a.capturado, incluye_iva: !!$('fIncl').checked,
    subtotal: a.subtotal, iva_pct: ivaPct(), iva: a.iva, retenciones: a.ret, total: a.total,
    justificacion: $('fJust').value.trim() || null, nivs,
    urgencia: $('fUrg').value, fecha_requerida: $('fReq').value || null,
    factura_numero: tipoForm==='factura' ? $('fNum').value.trim() : null,
    factura_fecha: tipoForm==='factura' ? ($('fFecha').value || null) : null,
    factura_uuid: tipoForm==='factura' ? ($('fUuid').value.trim().toUpperCase() || null) : null,
    gasto_tipo: tipoForm==='gasto' ? $('fGTipo').value : null,
    estadia: tipoForm==='gasto' ? estadiaVals() : null,
    xml_datos: tipoForm==='factura' ? xmlDatos : null
  };

  try{
    let id;
    if(editando){
      const { error } = await g.from('solicitudes').update(datos).eq('id', editando.id);
      if(error) throw error;
      id = editando.id;
    } else {
      datos.solicitante_id = estado.yo.id;
      const { data, error } = await g.from('solicitudes').insert(datos).select('id,folio').single();
      if(error) throw error;
      id = data.id;
    }
    await subirArchivos(id);
    if(editando){
      const { error } = await g.rpc('reenviar', { p_id: id });
      if(error) throw error;
      nota(`${editando.folio} reenviada a autorización.`);
    } else nota('Solicitud enviada a autorización.');
    editando = null;
    await cargar();
    const s = estado.lista.find(x=>x.id===id);
    if(s) verDetalle(s); else cerrar();
  }catch(err){
    const msg = String(err.message||err);
    nota(msg.includes('solicitudes_uuid_unico')
      ? 'Esa factura ya está registrada con el mismo folio fiscal.'
      : 'No se pudo guardar: ' + msg);
  }finally{
    if($('btnEnviar')){ btn.disabled = false; btn.textContent = editando ? 'Reenviar a autorización' : 'Enviar a autorización'; }
  }
}
async function subirArchivos(id){
  const pendientes = [];
  if(archivos.pdf) pendientes.push({clase:'pdf', file:archivos.pdf, nombre:archivos.pdf.name});
  if(archivos.xmlTexto && tipoForm==='factura') pendientes.push({clase:'xml', file:new Blob([archivos.xmlTexto],{type:'application/xml'}), nombre:archivos.xml.name});
  for(const p of pendientes){
    const ruta = `${id}/${p.clase}-${Date.now()}-${p.nombre.replace(/[^\w.\-]/g,'_')}`;
    const { error } = await core.storage.from(BUCKET).upload(ruta, p.file, { upsert:false });
    if(error){ nota('No se pudo subir ' + p.nombre + ': ' + error.message); continue; }
    await g.from('adjuntos').insert({ solicitud_id:id, clase:p.clase, nombre:p.nombre, ruta, tam_bytes:p.file.size });
  }
  archivos = {pdf:null,xml:null,xmlTexto:null};
}

/* ---------------- acciones ---------------- */
let claseMotivo = null;
async function accion(ac, extra){
  const s = estado.lista.find(x=>x.id===estado.abierto?.id); if(!s) return;
  let error = null;
  if(ac==='autorizar')      ({ error } = await g.rpc('autorizar', { p_id:s.id }));
  if(ac==='rechazar')       ({ error } = await g.rpc('rechazar',  { p_id:s.id, p_motivo:extra }));
  if(ac==='devolver')       ({ error } = await g.rpc('devolver',  { p_id:s.id, p_comentario:extra }));
  if(ac==='cancelar')       ({ error } = await g.rpc('cancelar',  { p_id:s.id }));
  if(ac==='recordar'){
    const t = turnoDe(s);
    const texto = `Hola ${nombreDe(t)}, tienes pendiente la solicitud ${s.folio} en la Plataforma HT: ${s.concepto}, por ${money(s.total)}${s.urgencia==='Urgente'?' (urgente)':''}. La registró ${s.solicitante_nombre}. Puedes revisarla en ${location.href.split('#')[0]}`;
    try{ await navigator.clipboard.writeText(texto); nota(`Recordatorio copiado para ${nombreDe(t)}.`); }
    catch(e){ prompt('Copia este recordatorio:', texto); }
    ({ error } = await g.rpc('registrar_recordatorio', { p_id:s.id }));
  }
  if(error){ nota('No se pudo completar: ' + error.message); return; }
  if(ac==='autorizar') nota(`${s.folio} autorizada.`);
  if(ac==='rechazar')  nota(`${s.folio} rechazada.`);
  if(ac==='devolver')  nota(`${s.folio} devuelta a ${s.solicitante_nombre}.`);
  await cargar();
}

async function verArchivo(idAdj){
  const s = estado.lista.find(x=>x.id===estado.abierto?.id);
  const a = (s?.adjuntos||[]).find(x=>x.id===idAdj); if(!a) return;
  const { data, error } = await core.storage.from(BUCKET).createSignedUrl(a.ruta, 3600);
  if(error){ nota('No se pudo abrir el archivo: ' + error.message); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}


/* ---------------- concentrado para pagos (envío manual) ---------------- */
function cuerpoReporte(lista, l){
  const th = 'style="background:#0B3D66;color:#fff;padding:8px;text-align:left;font-size:12px"';
  const td = 'style="padding:8px;border-bottom:1px solid #D5DBE5;font-size:13px;vertical-align:top"';
  const tdr = 'style="padding:8px;border-bottom:1px solid #D5DBE5;font-size:13px;text-align:right;white-space:nowrap"';
  const fila = (k,v) => `<tr><td style="padding:3px 12px 3px 0;color:#5A6680;font-size:12px;white-space:nowrap;vertical-align:top">${k}</td><td style="padding:3px 0;font-size:13px">${v}</td></tr>`;
  const total = lista.reduce((a,s)=>a+Number(s.total||0),0);
  const resumen = lista.map(s=>`<tr>
      <td ${td}><b>${esc(s.folio)}</b>${s.urgencia==='Urgente'?'<br><span style="color:#C63A2F;font-weight:bold">URGENTE</span>':''}</td>
      <td ${td}>${esc(s.proveedor||s.gasto_tipo||'')}</td>
      <td ${td}>${esc(s.concepto)}</td>
      <td ${td}>${esc(s.factura_numero||'Gasto')}</td>
      <td ${tdr}><b>${money(s.total)}</b></td></tr>`).join('');
  const detalle = lista.map(s=>{
    const aut = (s.historial||[]).filter(x=>/^Autoriz/.test(x.accion) && x.usuario!=='Sistema')
      .map(x=>`${esc(x.usuario)} (${fHora(x.fecha)})`).join('<br>');
    const e = s.estadia;
    const archivos = (s.adjuntos||[]).map(a=>esc(`${s.folio}_${a.clase.toUpperCase()}_${a.nombre}`)).join('<br>');
    return `<table width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #D5DBE5;border-left:6px solid ${s.urgencia==='Urgente'?'#C63A2F':'#3CE81E'};margin:0 0 16px">
      <tr><td style="padding:12px 14px;background:#F3F5F9">
        <span style="font-size:16px;font-weight:bold;color:#1B2A5C">${esc(s.folio)}</span>
        <span style="font-size:12px;background:#0B3D66;color:#fff;padding:2px 8px;margin-left:8px">${s.tipo==='factura'?'Factura':'Gasto'}</span>
        <span style="float:right;font-size:18px;font-weight:bold;color:#1B2A5C">${money(s.total)}</span>
      </td></tr>
      <tr><td style="padding:10px 14px"><table cellpadding="0" cellspacing="0">
        ${fila('Concepto', esc(s.concepto))}
        ${s.proveedor?fila('Proveedor', `${esc(s.proveedor)}${s.rfc?` · RFC ${esc(s.rfc)}`:''}`):''}
        ${s.factura_numero?fila('Factura', `${esc(s.factura_numero)}${s.factura_fecha?` del ${fDia(s.factura_fecha)}`:''}`):''}
        ${s.factura_uuid?fila('Folio fiscal', esc(s.factura_uuid)):''}
        ${s.gasto_tipo?fila('Tipo de gasto', esc(s.gasto_tipo)):''}
        ${fila('Importes', `Subtotal ${money(s.subtotal)} · IVA ${s.iva_pct}% ${money(s.iva)}${Number(s.retenciones)?` · Retenciones −${money(s.retenciones)}`:''} · <b>Total ${money(s.total)}</b>`)}
        ${e?.total?fila('Estadía', `${money(e.total)} estimados en ${esc(e.destino||'patio destino')} (${money(e.costoDia)} por día, ${e.dias} días)`):''}
        ${(s.nivs||[]).length?fila(`NIVs (${s.nivs.length})`, `<span style="font-family:Consolas,monospace;font-size:12px">${s.nivs.map(esc).join(', ')}</span>`):''}
        ${s.justificacion?fila(s.tipo==='gasto'?'Justificación':'Comentarios', esc(s.justificacion)):''}
        ${fila('Solicitó', `${esc(s.solicitante_nombre||'')}${s.solicitante_puesto?`, ${esc(s.solicitante_puesto)}`:''} (${fHora(s.creado)})`)}
        ${fila('Autorizaron', aut||'—')}
        ${s.fecha_requerida?fila('Fecha requerida', fDia(s.fecha_requerida)):''}
        ${fila('Archivos', archivos||'Sin archivos')}
      </table></td></tr></table>`;
  }).join('');
  return `<div style="font-family:Segoe UI,Arial,sans-serif;color:#15203B;max-width:860px">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0B3D66;border-bottom:5px solid #3CE81E">
    <tr><td style="padding:16px 20px">
      <div style="font-size:22px;font-weight:bold;font-style:italic;color:#fff">Autorización de ${SOLO_FACTURAS?'Facturas':'Gastos y Facturas'}</div>
      <div style="font-size:13px;color:#B9C8DC">Reporte de pagos autorizados · ${esc(fHora(new Date().toISOString()))}</div>
    </td><td style="padding:16px 20px;text-align:right;font-size:22px;font-weight:bold;font-style:italic;color:#3CE81E">HT RENT &gt;</td></tr>
  </table>
  <p style="font-size:15px;margin:18px 0">Se envían <b>${lista.length}</b> ${lista.length===1?'solicitud autorizada':'solicitudes autorizadas'} por Operaciones para su pago el <b>${esc(fLargo(l.pago))}</b>, por un total de <b style="font-size:17px">${money(total)}</b>.</p>
  <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:22px">
    <tr><th ${th}>Folio</th><th ${th}>Proveedor</th><th ${th}>Concepto</th><th ${th}>Factura</th><th ${th} align="right">Total</th></tr>
    ${resumen}
    <tr><td colspan="4" style="padding:10px 8px;text-align:right;font-weight:bold">Total del lote</td><td style="padding:10px 8px;text-align:right;font-weight:bold;font-size:15px;white-space:nowrap">${money(total)}</td></tr>
  </table>
  <div style="font-size:16px;font-weight:bold;color:#1B2A5C;margin:0 0 10px">Detalle por solicitud</div>
  ${detalle}</div>`;
}

async function verConcentrado(){
  const lista = estado.lista.filter(s=>s.estado==='autorizada')
    .sort((a,b)=>(b.urgencia==='Urgente')-(a.urgencia==='Urgente') || String(a.folio).localeCompare(String(b.folio)));
  const l = siguienteCorte(new Date());
  estado.abierto = {tipo:'concentrado'};
  $('panelTitulo').textContent = 'Concentrado para pagos';
  if(!lista.length){
    $('panelCuerpo').innerHTML = `<div class="bloque"><h3>No hay nada por enviar</h3><p class="q">Ninguna solicitud autorizada está pendiente de enviarse a pagos.</p></div>`;
    $('panelPie').innerHTML = ''; abrir(); return;
  }
  const total = lista.reduce((a,s)=>a+Number(s.total||0),0);
  const cuerpo = cuerpoReporte(lista, l);
  const asunto = `Pagos autorizados para el ${fDia(l.pago)} | ${lista.length} ${lista.length===1?'solicitud':'solicitudes'} por ${money(total)}`;
  const conArchivos = lista.flatMap(s=>(s.adjuntos||[]).map(a=>({...a, folio:s.folio})));
  $('panelCuerpo').innerHTML = `
    <div class="bloque foco"><h3>Para mandarlo por correo</h3>
      <p style="font-size:14px">1. Copia el concentrado y pégalo en el cuerpo del correo. 2. Descarga los archivos y adjúntalos. 3. Al enviarlo, márcalo como enviado aquí.</p>
      <div class="acciones" style="margin-top:12px">
        <button class="btn" data-ac="copiarReporte">Copiar concentrado</button>
        <button class="btn claro" data-ac="copiarAsunto">Copiar asunto</button>
        <button class="btn claro" data-ac="csvReporte">Descargar resumen en Excel</button>
        <button class="btn claro" data-ac="imprimirReporte">Imprimir o guardar PDF</button>
      </div>
    </div>
    ${conArchivos.length?`<div class="bloque"><h3>Archivos por adjuntar (${conArchivos.length})</h3>
      <div class="archivos" id="archivosLote">${conArchivos.map(a=>`<a class="chip" href="#" data-ver-lote="${a.id}">${esc(a.folio)} · ${a.clase.toUpperCase()}<small>${esc(a.nombre)}</small></a>`).join('')}</div>
      <p class="pista">Cada botón abre el archivo en otra pestaña para que lo guardes y lo adjuntes al correo.</p></div>`
      :'<div class="bloque"><p class="q">Ninguna de estas solicitudes trae archivos adjuntos.</p></div>'}
    <div class="bloque"><h3>Así se verá el correo</h3><div id="reporteHTML">${cuerpo}</div></div>`;
  $('panelPie').innerHTML = `<div class="panel-pie"><button class="btn claro" data-ac="cerrar">Cerrar</button><button class="btn navy" data-ac="marcarEnviadas">Marcar como enviadas a pagos</button></div>`;
  estado.reporte = {lista, asunto, cuerpo, total, pago:l.pago};
  abrir();
}

async function copiarReporte(){
  const cuerpo = estado.reporte?.cuerpo; if(!cuerpo) return;
  try{
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([cuerpo], {type:'text/html'}),
      'text/plain': new Blob([$('reporteHTML').innerText], {type:'text/plain'})
    })]);
    nota('Concentrado copiado. Pégalo en el correo con Ctrl + V.');
  }catch(e){
    const r = document.createRange(); r.selectNodeContents($('reporteHTML'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    nota('Selecciónalo y cópialo con Ctrl + C.');
  }
}
function csvReporte(){
  const lista = estado.reporte?.lista || [];
  const col = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const filas = [['Folio','Tipo','Proveedor','RFC','No. factura','UUID','Concepto','Subtotal','IVA %','IVA','Retenciones','Total','NIVs','Solicita','Capturada','Autorizada','Prioridad'],
    ...lista.map(s=>[s.folio, s.tipo==='factura'?'Factura':'Gasto', s.proveedor, s.rfc, s.factura_numero, s.factura_uuid, s.concepto,
      s.subtotal, s.iva_pct, s.iva, s.retenciones, s.total, (s.nivs||[]).join(' '), s.solicitante_nombre,
      fHora(s.creado), fHora(s.autorizado_en), s.urgencia])];
  const csv = '\uFEFF' + filas.map(r=>r.map(col).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = `Resumen_pagos_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function imprimirReporte(){
  const v = window.open('', '_blank');
  if(!v){ nota('El navegador bloqueó la ventana. Permite las ventanas emergentes.'); return; }
  v.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${esc(estado.reporte.asunto)}</title></head><body>${estado.reporte.cuerpo}</body></html>`);
  v.document.close(); setTimeout(()=>v.print(), 400);
}
async function abrirArchivoLote(id){
  const a = (estado.reporte?.lista||[]).flatMap(s=>s.adjuntos||[]).find(x=>x.id===id); if(!a) return;
  const { data, error } = await core.storage.from(BUCKET).createSignedUrl(a.ruta, 3600);
  if(error){ nota('No se pudo abrir el archivo: ' + error.message); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}
async function marcarEnviadas(){
  const n = estado.reporte?.lista?.length || 0;
  if(!confirm(`¿Marcar ${n} ${n===1?'solicitud':'solicitudes'} como enviadas a pagos? Hazlo solo después de mandar el correo.`)) return;
  const { data, error } = await g.rpc('enviar_lote_manual');
  if(error){ nota('No se pudo marcar el lote: ' + error.message); return; }
  const r = Array.isArray(data) ? data[0] : data;
  nota(`Lote enviado: ${r?.num_solicitudes ?? n} ${(r?.num_solicitudes ?? n)===1?'solicitud':'solicitudes'} por ${money(r?.total ?? 0)}.`);
  await cargar(); cerrar();
}

/* ---------------- eventos ---------------- */
document.addEventListener('click', async ev => {
  const verLote = ev.target.closest('[data-ver-lote]');
  if(verLote){ ev.preventDefault(); abrirArchivoLote(verLote.dataset.verLote); return; }
  const ver = ev.target.closest('[data-ver]');
  if(ver){ ev.preventDefault(); verArchivo(ver.dataset.ver); return; }
  const b = ev.target.closest('[data-ac]');
  if(b){
    ev.preventDefault();
    const ac = b.dataset.ac;
    if(ac==='cerrar') cerrar();
    if(ac==='tipo'){ tipoForm = b.dataset.v; if(tipoForm!=='factura'){ xmlDatos=null; archivos.xml=null; archivos.xmlTexto=null; } nuevaSolicitud(editando ? {...editando, tipo:tipoForm} : {tipo:tipoForm}); }
    if(ac==='quitarXml'){ xmlDatos=null; archivos.xml=null; archivos.xmlTexto=null; $('xmlAviso').innerHTML=''; const c=$('cajaXml'); c.classList.remove('tiene'); c.querySelector('span').textContent='Arrastra o elige el XML. Llena número, proveedor, montos, IVA y UUID.'; bloquearXml(); recalcular(); }
    if(ac==='enviar') enviar();
    if(ac==='autorizar') accion('autorizar');
    if(ac==='pedirMotivo'){ claseMotivo = b.dataset.clase; $('motivo').classList.add('on'); $('motivoLbl').textContent = claseMotivo==='rechazar' ? 'Motivo del rechazo (obligatorio)' : '¿Qué se debe corregir? (obligatorio)'; $('motivoTxt').focus(); }
    if(ac==='ocultarMotivo') $('motivo').classList.remove('on');
    if(ac==='confirmarMotivo'){ const t=$('motivoTxt').value.trim(); if(t.length<5){ nota('Escribe el motivo.'); return; } accion(claseMotivo, t); }
    if(ac==='corregir'){ const s = estado.lista.find(x=>x.id===estado.abierto?.id); if(s) nuevaSolicitud(s); }
    if(ac==='cancelar'){ if(confirm('¿Cancelar esta solicitud? Queda en el historial como cancelada.')) accion('cancelar'); }
    if(ac==='recordar') accion('recordar');
    if(ac==='copiarReporte') copiarReporte();
    if(ac==='copiarAsunto'){ navigator.clipboard.writeText(estado.reporte?.asunto||'').then(()=>nota('Asunto copiado.')).catch(()=>prompt('Copia el asunto:', estado.reporte?.asunto||'')); }
    if(ac==='csvReporte') csvReporte();
    if(ac==='imprimirReporte') imprimirReporte();
    if(ac==='marcarEnviadas') marcarEnviadas();
    return;
  }
  const fila = ev.target.closest('tr.fila') || ev.target.closest('[data-id]');
  if(fila && fila.dataset.id){ const s = estado.lista.find(x=>x.id===fila.dataset.id); if(s){ ev.preventDefault(); verDetalle(s); } return; }
  const tab = ev.target.closest('[data-tab]');
  if(tab){ estado.tab = tab.dataset.tab; pintar(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id==='upXml' && t.files[0]) tomarXml(t.files[0]);
  if(t.id==='upPdf' && t.files[0]) tomarPdf(t.files[0]);
  if(estado.abierto?.tipo==='forma' && t.closest('#panelCuerpo')){
    if(t.id==='fGTipo' && t.value==='Movimiento entre patios' && $('fEstadia')) $('fEstadia').checked = true;
    recalcular();
  }
});
document.addEventListener('input', ev => { if(estado.abierto?.tipo==='forma' && ev.target.closest('#panelCuerpo')) recalcular(); });
document.addEventListener('dragover', ev => { const d = ev.target.closest('.soltar'); if(d){ ev.preventDefault(); d.classList.add('encima'); } });
document.addEventListener('dragleave', ev => { const d = ev.target.closest('.soltar'); if(d) d.classList.remove('encima'); });
document.addEventListener('drop', ev => {
  const d = ev.target.closest('.soltar'); if(!d) return;
  ev.preventDefault(); d.classList.remove('encima');
  const f = ev.dataTransfer.files[0]; if(!f) return;
  if(/\.xml$/i.test(f.name) && $('cajaXml')) tomarXml(f);
  else if(/\.pdf$/i.test(f.name)) tomarPdf(f);
  else nota('Usa un archivo XML o PDF.');
});
document.addEventListener('keydown', ev => { if(ev.key==='Escape' && $('panel').classList.contains('on')) cerrar(); });
$('telon').addEventListener('click', cerrar);
$('cerrar').addEventListener('click', cerrar);
$('nueva').addEventListener('click', () => nuevaSolicitud(null));
$('concentrado').addEventListener('click', verConcentrado);
$('q').addEventListener('input', e => { estado.q = e.target.value; pintar(); });
$('fTipo').addEventListener('change', e => { estado.fTipo = e.target.value; pintar(); });
$('fEstado').addEventListener('change', e => { estado.fEstado = e.target.value; pintar(); });
$('salir').addEventListener('click', async () => { await core.auth.signOut(); location.href = 'index.html'; });

if(SOLO_FACTURAS){
  document.title = 'Autorización de facturas · Plataforma HT';
  $('titulo').textContent = 'Autorización de facturas';
  $('subtitulo').textContent = 'Facturas de proveedores · corte lunes y miércoles a las 12:00';
  [...$('fTipo').options].forEach(o => { if(o.value==='gasto') o.remove(); });
  $('fTipo').options[0].textContent = 'Todas las facturas';
}

await cargar();
</script>
